[build-system]
requires = ["setuptools>=68,<76", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficlens"
version = "1.0.0"
description = "Traffic analytics from any camera: gate counting, calibrated speeds, and a browser engine that runs the detector on your GPU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Safdar Hussain", email = "safdar.eryx@gmail.com" }]
keywords = ["computer-vision", "object-tracking", "traffic", "yolo", "speed-estimation", "onnxruntime"]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "opencv-python>=4.9,<5",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    "click>=8.1,<9",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.4,<8.5", "torch>=2.2,<3"]
onnx = ["onnxruntime>=1.19,<2"]
serve = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1", "onnx>=1.16,<2", "onnxslim>=0.1,<1", "matplotlib>=3.8,<4"]

[project.scripts]
trafficlens = "trafficlens.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
