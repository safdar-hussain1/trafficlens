[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficlens"
version = "1.0.0"
description = "Real-time traffic analytics: multi-class object counting and speed estimation from any camera, video file, or RTSP stream."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Safdar Hussain", email = "safdar.eryx@gmail.com" }]
keywords = ["computer-vision", "object-detection", "object-tracking", "traffic", "yolo", "speed-estimation"]
dependencies = [
    "ultralytics>=8.4",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
trafficlens = "trafficlens.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trafficlens.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
