# Both suites, on every push to main and every pull request against it.
#
# What this does not run, on purpose, and why:
#
# - No sample-clip download. data/samples/ is git-ignored and fetched from
#   Wikimedia Commons and GitHub by `trafficlens fetch-samples`; a step that
#   downloads it would tie the colour of this job to a third-party host being
#   up. The six tests that decode the real clip skip with a stated reason.
# - No detector extra. torch and ultralytics are only needed by the four tests
#   that load the git-ignored YOLO weights, which a checkout does not have, so
#   those tests skip whether or not torch is installed.
# - Nothing that needs a browser or a GPU. The page's own selftest and the
#   backend timings run in headless Chrome through scripts/verify_page.sh and
#   scripts/measure_backend.sh, outside pytest and outside this workflow.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # opencv-python loads libGL when it is imported. GitHub's Ubuntu image
      # ships it; the install only runs if that ever stops being true.
      - name: OpenCV system library
        run: |
          if ! ldconfig -p | grep 'libGL\.so\.1' > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y libgl1
          fi

      - name: Install
        run: python -m pip install -e ".[onnx,dev]"

      - name: Test
        run: python -m pytest -rs

  web:
    name: web (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The site in docs/ is committed, so it must be exactly what the build
      # produces from the committed sources: nothing changed, nothing missing,
      # nothing extra.
      - name: The build reproduces the committed docs/
        run: |
          changes="$(git status --porcelain -- ../docs)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "docs/ is not what npm run build produces from the committed sources."
            exit 1
          fi
