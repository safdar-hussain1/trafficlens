# Motorway sample: a German autobahn filmed from an overpass, three lanes
# per carriageway, dense afternoon traffic. Fetch the clip with
# `trafficlens fetch-samples`.
source: data/samples/motorway-a40.webm

detector:
  model: yolo11s.pt
  classes: [car, truck, bus, motorcycle]
  confidence: 0.25
  imgsz: 640

# One gate per carriageway; both stop at the median on purpose. A single
# gate drawn across both carriageways would count the opposing
# carriageway's ordinary flow as wrong-way traffic, so each gate covers
# exactly the lanes whose expected direction it names.
#
# Direction labels are named for the geometry, not left at the "in"/"out"
# defaults. Both gates run left to right at a constant image y, so
# core.geometry.side_of_line puts the side up the frame -- away from the
# camera -- at +1, and the side down the frame -- toward the camera -- at
# -1. Both gates therefore share one convention, label_positive: away and
# label_negative: toward, and each gate names the direction its own
# carriageway actually flows. Taking the defaults instead labelled every
# ordinary approach "out" while the gate expected "in", so every single
# crossing on both carriageways fired a wrong-way incident.
gates:
  - name: inbound            # left carriageway, traffic toward the camera
    start: [0.06, 0.80]
    end: [0.46, 0.80]
    label_positive: away
    label_negative: toward
    expected_direction: toward
  - name: outbound           # right carriageway, traffic away from the camera
    start: [0.52, 0.80]
    end: [0.69, 0.80]
    label_positive: away
    label_negative: toward
    expected_direction: away

# NO CALIBRATION BLOCK, DELIBERATELY. Do not restore one from history.
#
# This clip is uncalibrated, so the engine returns None for every speed on
# it. That is not a gap and not a workaround -- it is the behaviour
# core/homography.py and analytics/speed.py were built to guarantee: an
# uncalibrated camera reports no speed, ever, never a pixel-derived guess.
# The product's flagship clip exercises the product's own honesty feature.
#
# Why the block that used to be here was removed, in one line: the
# correspondences it was fitted from are mutually inconsistent, and the
# along-road scale they encoded has no independent anchor anywhere in this
# footage. Both halves are measured, not asserted:
#
#   1. The two surveyed lane dividers disagree with each other. Both lines'
#      dashes are consecutive and uniform, yet the transfer that fits
#      divider 1's assumed 18 m ladder reads ~26 m per step on divider 2 --
#      a factor of ~1.46, at every plausible horizon row. Two dashed
#      dividers on one carriageway cannot differ by that. The old 7-point
#      fit scored 0.12 m against its own points while the data underneath
#      it disagreed with itself.
#   2. The obvious repair does not exist. Dropping the disputed divider-2
#      points leaves six correspondences on ONE image line at ONE cross-road
#      offset -- a collinear configuration, from which no homography can be
#      computed at all. The disputed points were the only cross-road
#      information the survey ever had.
#   3. And the 18 m itself was never anchored. It was taken from the German
#      autobahn standard (6 m stroke, 18 m period), but the painted stroke
#      measures ~0.50 of the period here where that standard requires
#      0.333. A survey for an independent along-road anchor -- guardrail
#      posts, delineator posts, barrier joints, any other repeating
#      structure -- found none usable.
#
# The full investigation, with its matched controls and the negative
# result written up as content rather than as a footnote, is
# reports/speed_real.json. The surveyed points themselves are kept in
# data/fixtures/motorway_scale_survey.json so the finding stays
# reproducible after this block was deleted; tests/test_scale_survey.py
# re-runs it.
#
# Consequences, stated rather than worked around: no speed is reported for
# this clip; stopped-vehicle detection never fires on it, because that
# feature requires calibrated speed by design; and the speed-limit
# violation feature can only be demonstrated here with a limit the user
# sets explicitly.
#
# What would change this: a calibrated capture of this site with a visible
# ground-truth baseline, or GNSS-tracked probe-vehicle passes. Not more
# analysis of this clip.
#

# No limit set: a limit sign is visible on the median in this clip but
# its value is not legible at this resolution, and an invented limit
# would flag invented violations.
speed:
  unit: kmh
